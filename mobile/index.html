<!doctype html>
<html lang="en" dir="ltr" data-theme="pink">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff7f8" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="./favicon.svg" />
    <title>Halovia</title>
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var saved = JSON.parse(localStorage.getItem("halovia.ride.settings.v1") || "null");
        if (saved && ["pink", "light", "dark"].indexOf(saved.theme) >= 0) document.documentElement.dataset.theme = saved.theme;
        if (saved && ["en", "hi", "es"].indexOf(saved.language) >= 0) document.documentElement.lang = saved.language;
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
